services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: lpq_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8 --auth-local=trust --auth-host=scram-sha-256"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
      - ../supabase/migrations:/migrations:ro
      - ../supabase/seed.sql:/seed.sql:ro
    # Terikat ke 127.0.0.1, bukan ke semua antarmuka jaringan.
    #
    # Tanpa alamat di depannya, Docker mengikat port ini ke 0.0.0.0 DAN menulis
    # aturannya langsung ke iptables — sehingga ufw tidak menghalanginya. Di VPS
    # itu berarti PostgreSQL sekolah terbuka ke internet dan kena pindai dalam
    # hitungan jam. Port ini hanya perlu dijangkau dari mesin itu sendiri;
    # container api memanggil db lewat jaringan internal Docker, bukan lewat
    # port ini.
    #
    # BIND_HOST bisa diubah lewat backend/.env, dan hanya perlu diubah pada mesin
    # pengembangan Windows: winnat kadang merebut rentang port di loopback,
    # sehingga bind ke 127.0.0.1 ditolak sistem. JANGAN diubah di server.
    # DB_HOST_PORT juga bisa diubah, untuk mesin yang sudah menjalankan
    # PostgreSQL sendiri di 5432. Nomor ini hanya dipakai dari luar container;
    # api tetap memanggil db:5432 lewat jaringan internal Docker.
    ports:
      - "${BIND_HOST:-127.0.0.1}:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lpq_db"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/lpq_db
    volumes:
      - uploads:/app/uploads
    # Sama alasannya dengan db. Yang menjangkau port ini hanya Caddy atau Nginx
    # di mesin yang sama; pengunjung selalu lewat HTTPS di depannya. Dibiarkan
    # 0.0.0.0, alamat API bisa dibuka langsung lewat http:// tanpa terenkripsi,
    # melangkahi seluruh penjagaan di server web.
    ports:
      - "${BIND_HOST:-127.0.0.1}:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
